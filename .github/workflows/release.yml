name: Release candidate build (publishing disabled)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected PEP 440 package version (for example, 2.0.0a2)"
        required: true
        type: string

run-name: Release candidate ${{ inputs.version }} (no publish)

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1704067200"
    steps:
      - name: Check out selected release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the immutable matching release tag
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: python scripts/check_release_ref.py --version "${EXPECTED_VERSION}"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release tools
        run: |
          python -m pip install \
            "build==1.3.0" \
            "mypy==1.17.1" \
            "pytest==8.4.2" \
            "twine==6.2.0"
      - name: Verify tests and typing
        run: |
          python -m pip install --no-deps .
          python -m pytest
          python -m mypy
      - name: Verify known licensing blocker
        run: python scripts/check_license.py --expect-blocked
      - name: Build and inspect candidate
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python scripts/build_reproducibly.py \
            --output release-artifact/packages
          python scripts/check_artifacts.py release-artifact/packages \
            --expected-version "${EXPECTED_VERSION}" \
            --write-manifest release-artifact/artifact-manifest.json
          python scripts/test_artifact_policy.py release-artifact/packages
          python -m twine check \
            release-artifact/packages/*.whl \
            release-artifact/packages/*.tar.gz
      - name: Upload candidate for maintainer review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ inputs.version }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30

  # SECURITY CONTROL: this job is intentionally unreachable. After the
  # maintainer resolves LICENSING.md and model provenance, enable it in a
  # dedicated reviewed change and protect the `pypi` environment with required
  # approvers. Merely running this workflow can never publish the package.
  publish:
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/address-normalizer
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download the inspected candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ inputs.version }}
          path: release-artifact/
      - name: Recheck license, version, contents, and checksums
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python scripts/check_license.py --require-publishable
          python scripts/check_artifacts.py release-artifact/packages \
            --expected-version "${EXPECTED_VERSION}" \
            --verify-manifest release-artifact/artifact-manifest.json
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: release-artifact/packages/
          skip-existing: false
          verbose: true
