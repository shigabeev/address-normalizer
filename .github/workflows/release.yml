name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, for example 2.0.0a2"
        required: true
        type: string
      repository:
        description: "Package index"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

run-name: Release ${{ inputs.version }} to ${{ inputs.repository }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.3.0 pytest==8.4.2 twine==6.2.0
      - run: python -m pip install --no-deps .
      - name: Verify tag and version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(python -c 'import address_normalizer; print(address_normalizer.__version__)')"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "v${EXPECTED_VERSION}"
          test "${PACKAGE_VERSION}" = "${EXPECTED_VERSION}"
      - run: python -m pytest
      - run: python tools/benchmark.py --check
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-${{ inputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository }}
      url: ${{ inputs.repository == 'pypi' && 'https://pypi.org/p/address-normalizer' || 'https://test.pypi.org/p/address-normalizer' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions-${{ inputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
      - name: Create GitHub release
        if: ${{ inputs.repository == 'pypi' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "address-normalizer ${GITHUB_REF_NAME}" \
            --generate-notes
