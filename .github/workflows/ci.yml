name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build
          python -m pip install .
      - name: Run tests
        run: pytest
      - name: Verify compact model
        run: |
          python training/evaluate_compact_tagger.py
          python training/train_compact_tagger.py \
            --output /tmp/regenerated-model.json \
            --report /tmp/regenerated-model-report.json
          cmp src/address_normalizer/data/model.json /tmp/regenerated-model.json
      - name: Enforce legacy-reference release gates
        run: |
          python evaluation/evaluate.py \
            --data evaluation/legacy_reference_500.jsonl \
            --gates evaluation/release_gates.json
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          python -c "from pathlib import Path; files=list(Path('dist').glob('*')); assert files and max(p.stat().st_size for p in files) < 15_000_000, files"
