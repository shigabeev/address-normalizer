name: Bug report
description: Report incorrect parsing, spans, detection, CLI, or packaging
title: "bug: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: Use a synthetic or redacted address. Never post private customer data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 2.0.0
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and why
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment or additional context
