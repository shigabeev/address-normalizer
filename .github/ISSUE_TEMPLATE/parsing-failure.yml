name: Parsing failure
description: Share one redacted or synthetic address with expected fields and spans
title: "[Parse] "
labels:
  - parsing
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        One minimal case is more useful than a private corpus dump. Replace real
        personal data with a synthetic address that still reproduces the
        behavior. Confidence is not a correctness probability.
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: 2.0.0a2 / abc1234
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal address input
      description: Use synthetic or safely redacted text; preserve punctuation and Unicode relevant to the failure.
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Current `parse(...).as_dict()` output
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected fields and offsets
      description: List each expected value and `[start, end)` span. Explain ambiguous interpretations.
      placeholder: |
        street: value="...", span=[0, 10]
        house_num: value="...", span=[12, 13]
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Input domain
      description: This helps compare evidence without mixing benchmark domains.
      options:
        - Synthetic minimal reproduction
        - User-entered or noisy address
        - Clean registry-style address
        - Historical v1 compatibility case
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Application impact
      description: Which downstream decision is wrong, and can resolver/review policy catch it?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: The input is synthetic or safely redacted and contains no private address data.
          required: true
        - label: I checked warnings, alternatives, and unparsed output rather than only normalized text.
          required: true
        - label: I understand that this report may become a public regression example.
          required: true
