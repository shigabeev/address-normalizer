name: Data provenance
description: Record source, permission, redistribution, or benchmark-integrity information
title: "[Provenance] "
labels:
  - data
  - provenance
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Do not upload the dataset or sample rows unless redistribution is
        clearly permitted. This form records evidence for maintainer review; it
        does not itself authorize use.
  - type: input
    id: source
    attributes:
      label: Source and publisher
      placeholder: Dataset title — publishing organization
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Canonical source URL
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version, revision, and retrieval date
      description: Include immutable revision IDs and checksums where available.
    validations:
      required: true
  - type: textarea
    id: terms
    attributes:
      label: License or terms evidence
      description: Link the exact terms and quote only the clause needed to explain use or redistribution.
    validations:
      required: true
  - type: dropdown
    id: intended_use
    attributes:
      label: Proposed role
      options:
        - Provenance correction only
        - Independent sealed evaluation
        - Train or validation data
        - Redistributed derived artifact
        - Runtime package data
        - Other or undecided
    validations:
      required: true
  - type: textarea
    id: processing
    attributes:
      label: Filtering, transformations, and split policy
      description: Include deduplication, grouping, leakage prevention, and personal-data handling.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Open questions and risks
      description: Note conflicting terms, stale snapshots, bias, private data, or attribution obligations.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I have not attached unlicensed, private, or redistribution-restricted data.
          required: true
        - label: I am not treating this form as legal approval to use the source.
          required: true
